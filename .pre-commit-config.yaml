repos:
  - repo: local
    hooks:
      - id: dune-build
        name: dune build
        entry: dune build
        language: system
        pass_filenames: false
        always_run: true

      - id: dune-fmt
        name: dune fmt check
        entry: dune build @fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: dune-fmt
        name: dune fmt
        entry: dune fmt
        language: system
        pass_filenames: false
        always_run: true
